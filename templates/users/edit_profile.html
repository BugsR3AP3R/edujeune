{% extends 'base/base.html' %}
{% block title %}Modifier mon profil — EduJeunes{% endblock %}
{% block body %}
<div class="container-main py-4" style="max-width:600px">
  <h2 style="font-weight:800;margin-bottom:1.5rem">Modifier mon profil</h2>
  <div class="card p-4">
    <form method="post" enctype="multipart/form-data" action="{% url 'edit_profile' %}">
      {% csrf_token %}
      <div class="row g-3">
        <div class="col-6"><label class="form-label">Prénom</label><input name="first_name" type="text" class="form-control" value="{{ user.first_name }}"></div>
        <div class="col-6"><label class="form-label">Nom</label><input name="last_name" type="text" class="form-control" value="{{ user.last_name }}"></div>
        <div class="col-12"><label class="form-label">Email</label><input name="email" type="email" class="form-control" value="{{ user.email }}"></div>
        <div class="col-12"><label class="form-label">Bio</label><textarea name="bio" class="form-control" rows="3" placeholder="Présente-toi…">{{ user.bio }}</textarea></div>
        <div class="col-12"><label class="form-label">Pays</label><input name="country" type="text" class="form-control" value="{{ user.country }}"></div>
        <div class="col-12">
          <label class="form-label">Photo de profil</label>
          {% if user.avatar %}<div class="mb-2"><img src="{{ user.avatar.url }}" style="width:48px;height:48px;border-radius:50%;object-fit:cover"></div>{% endif %}
          <input name="avatar" type="file" class="form-control" accept="image/*">
        </div>
      </div>
      <div class="d-flex gap-2 mt-4">
        <a href="{% url 'profile' %}" class="btn btn-ghost">Annuler</a>
        <button type="submit" class="btn btn-primary flex-grow-1">Enregistrer les modifications</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
