{% extends 'base/base.html' %}
{% block title %}Programmer un live — EduJeunes{% endblock %}
{% block body %}
<div class="container-main py-4" style="max-width:580px">
  <a href="{% url 'manage_course' slug=course.slug %}" style="font-size:.8rem;color:var(--muted);text-decoration:none"><i class="bi bi-arrow-left me-1"></i>Retour à la gestion</a>
  <h1 style="font-size:1.5rem;font-weight:800;margin-top:.5rem;margin-bottom:1.5rem">Programmer un live</h1>
  <div style="background:rgba(255,107,43,.06);border:1px solid rgba(255,107,43,.2);border-radius:10px;padding:.75rem 1rem;margin-bottom:1.5rem;font-size:.85rem;color:var(--muted)">
    <i class="bi bi-info-circle me-2" style="color:var(--pr)"></i>Cours : <strong style="color:var(--txt)">{{ course.title }}</strong>
  </div>
  <div class="card p-4">
    <form method="post" action="{% url 'schedule_live' slug=course.slug %}">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Titre du live *</label>
        <input name="title" type="text" class="form-control" placeholder="Ex: Session Q&A — Module 3" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea name="description" class="form-control" rows="3" placeholder="Décris ce live…"></textarea>
      </div>
      <div class="mb-4">
        <label class="form-label">Date et heure *</label>
        <input name="scheduled_at" type="datetime-local" class="form-control" required>
      </div>
      <div class="form-check mb-4">
        <input name="is_recorded" type="checkbox" class="form-check-input" id="rec" checked>
        <label class="form-check-label" for="rec">Enregistrer le live pour rediffusion</label>
      </div>
      <div class="d-flex gap-2">
        <a href="{% url 'manage_course' slug=course.slug %}" class="btn btn-ghost">Annuler</a>
        <button type="submit" class="btn btn-primary flex-grow-1"><i class="bi bi-broadcast me-2"></i>Programmer le live</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
