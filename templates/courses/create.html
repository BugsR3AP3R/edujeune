{% extends 'base/base.html' %}
{% block title %}Créer un cours — EduJeunes{% endblock %}
{% block body %}
<div class="container-main py-4" style="max-width:700px">
  <a href="{% url 'dashboard' %}" style="font-size:.8rem;color:var(--muted);text-decoration:none"><i class="bi bi-arrow-left me-1"></i>Dashboard</a>
  <h1 style="font-size:1.6rem;font-weight:800;margin-top:.5rem;margin-bottom:1.5rem">Créer un nouveau cours</h1>
  {% if errors %}
  <div class="alert alert-danger mb-3">{% for e in errors %}<div>{{ e }}</div>{% endfor %}</div>
  {% endif %}
  <div class="card p-4">
    <form method="post" enctype="multipart/form-data" action="{% url 'create_course' %}">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Titre du cours *</label>
        <input name="title" type="text" class="form-control" placeholder="Ex: Introduction au Python pour débutants" value="{{ post.title }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Description *</label>
        <textarea name="description" class="form-control" rows="4" placeholder="Décris ce que les étudiants apprendront…">{{ post.description }}</textarea>
      </div>
      <div class="row g-3 mb-3">
        <div class="col-md-4">
          <label class="form-label">Catégorie</label>
          <select name="category" class="form-select">
            <option value="">— Sans catégorie —</option>
            {% for cat in categories %}<option value="{{ cat.id }}" {% if post.category == cat.id|stringformat:"s" %}selected{% endif %}>{{ cat.name }}</option>{% endfor %}
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">Niveau</label>
          <select name="level" class="form-select">
            <option value="beginner">Débutant</option>
            <option value="intermediate">Intermédiaire</option>
            <option value="advanced">Avancé</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">Langue</label>
          <select name="language" class="form-select">
            <option value="Français">🇫🇷 Français</option>
            <option value="Créole haïtien">🇭🇹 Créole haïtien</option>
            <option value="Anglais">🇺🇸 Anglais</option>
            <option value="Espagnol">🇪🇸 Espagnol</option>
          </select>
        </div>
      </div>
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label">Ce que les étudiants apprendront</label>
          <textarea name="what_you_learn" class="form-control" rows="3" placeholder="Liste des objectifs d'apprentissage…">{{ post.what_you_learn }}</textarea>
        </div>
        <div class="col-md-6">
          <label class="form-label">Prérequis</label>
          <textarea name="requirements" class="form-control" rows="3" placeholder="Connaissances préalables nécessaires…">{{ post.requirements }}</textarea>
        </div>
      </div>
      <div class="row g-3 mb-4">
        <div class="col-md-6">
          <label class="form-label">Image de couverture</label>
          <input name="thumbnail" type="file" class="form-control" accept="image/*">
        </div>
        <div class="col-md-3">
          <label class="form-label">Prix ($)</label>
          <input name="price" type="number" class="form-control" value="0" min="0" step="0.01">
          <div class="form-check mt-2">
            <input name="is_free" type="checkbox" class="form-check-input" id="is_free" checked>
            <label class="form-check-label" for="is_free" style="font-size:.85rem">Cours gratuit</label>
          </div>
        </div>
      </div>
      <div class="d-flex gap-2 flex-wrap">
        <button type="submit" name="status" value="draft" class="btn btn-ghost px-4">
          <i class="bi bi-floppy me-2"></i>Sauvegarder (brouillon)
        </button>
        <button type="submit" name="status" value="published" class="btn btn-primary px-4">
          <i class="bi bi-cloud-upload me-2"></i>Publier maintenant
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
